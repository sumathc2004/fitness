<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainer Admin – SVD Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dash.css">
<link rel="stylesheet" href="polish.css">
<link rel="stylesheet" href="pay.css">
</head>
<body class="admin">
<div class="app">
  <aside class="side" id="side">
    <a href="index.html" class="logo"><i>SVD</i>SVD <span>Fitness</span></a>
    <span class="rolechip">🛡️ Trainer console</span>
    <nav class="menu" id="menu">
      <button data-v="dash" class="on"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>Dashboard</button>
      <button data-v="clients"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 010 8M22 21c0-3-2-5-4-5.6"/></svg></span>Clients</button>
      <button data-v="pay"><span class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg></span>Payments</button>
    </nav>
    <div class="side-foot">
      <small>Signed in as</small><b id="adminName">Trainer</b>
      <a href="index.html" style="margin-bottom:8px">← Website</a>
      <button id="logout">Logout</button>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <div style="display:flex;gap:14px;align-items:center">
        <button class="burger" id="burger" aria-label="Menu">☰</button>
        <div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Your clients at a glance.</p></div>
      </div>
      <div class="top-r">
        <span class="datechip" id="dateChip"></span>
        <button class="theme" id="theme" aria-label="Toggle dark mode" title="Light / dark">🌙</button>
        <button class="btn" id="addTop">+ Add client</button>
      </div>
    </div>
    <div id="root"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script src="ui.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="pay.js"></script>
<script src="admin.js"></script>
<script src="admin-pay.js"></script>
</body>
</html>
