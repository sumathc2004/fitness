# Local development database. Uses its own port (5433) so it never collides with another PostgreSQL on this machine.
services:
  db:
    image: postgres:16-alpine
    container_name: gym-platform-pg
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-gym_platform}
      POSTGRES_USER: ${DB_USER:-gym}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gym_dev_password}
      TZ: UTC
    volumes:
      - gym_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gym} -d ${DB_NAME:-gym_platform}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  gym_pg_data:
